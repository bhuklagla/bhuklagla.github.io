name: Website checks
on:
  push:
    branches: [main, 'website/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - run: npm run build
        env:
          PUBLIC_SITE_URL: https://milanbeherazyx.github.io
          PUBLIC_BASE_PATH: /bhuklagla.github.io/
          PUBLIC_WEB3FORMS_KEY: '30e2a51f-6b1d-4a32-a06b-83723a66b242'
          PUBLIC_JOURNEY_API: ${{ vars.PUBLIC_JOURNEY_API }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: bhuk-lagla-website
          path: dist
